<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Template Columns y Rows</title>
  <style>
    .grid-container {
      width: 100%;
      min-height: 900px;
      background-color: rebeccapurple;

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto auto;
      gap: 10px;
    }

    .grid-item {
      background-color: violet;
      padding: 10px;
      color: white;
      font-weight: bold;
      text-align: center;
    }

    .header {
      grid-column: 1 / 4;
      background-color: purple;
    }

    .nav {
      grid-column: 1 / 4;
      background-color: rgb(185, 0, 185);
    }

    .contenido1 {
      grid-column: 1 / 3;
      grid-row: 3;
      background-color: rgb(185, 0, 120);
    }

    .contenido2 {
      grid-column: 1;
      grid-row: 4;
      background-color: orange;
    }

    .contenido3 {
      grid-column: 2;
      grid-row: 4;
      background-color: gold;
    }

    .aside {
      grid-column: 3 / 4;
      grid-row: 3 / 5; 
      background-color: rgb(185, 0, 34);
    }

    .footer {
      grid-column: 1 / 4;
      background-color: rgb(239, 17, 17);
    }


    @media (max-width: 720px) {
      .grid-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }

      .grid-item {
        grid-column: 1 / 2;
        grid-row: auto;
      }
    }
  </style>
</head>
<body>
  <section class="grid-container">
    <div class="grid-item header">header</div>
    <div class="grid-item nav">nav</div>
    <div class="grid-item contenido1">contenido1</div>
    <div class="grid-item contenido2">contenido2</div>
    <div class="grid-item contenido3">contenido3</div>
    <div class="grid-item aside">aside</div>
    <div class="grid-item footer">footer</div>
    <a href="index.html" style="display: block; text-align: center; margin-top: 20px; font-weight: bold; text-decoration: none; color: white; background-color: black; padding: 10px; border-radius: 5px;">
        Versión con areas
      </a>
  </section>
</body>
</html>
